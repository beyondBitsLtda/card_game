<!--    | Parte                 | Função                                                       |
        | --------------------- | ------------------------------------------------------------ |
        | `<!DOCTYPE html>`     | Diz ao navegador que o documento usa o padrão HTML5          |
        | `<html lang="pt-BR">` | Define o idioma principal                                    |
        | `<head>`              | Contém **metadados**, **título**, **CSS**, **configurações** |
        | `<body>`              | Contém o **conteúdo visível** da página                      |
        | `<script>`            | Carrega o **JavaScript**, geralmente no final do body        |

-->


<!DOCTYPE html> <!-- Define o padrão HTML5 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"> <!-- Define codificação -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsividade -->
  <title>Título da Página</title>
  <link rel="stylesheet" href="css/style.css"> <!-- Importa o CSS -->
</head>

<body>
  <!-- Conteúdo visível -->
  <header>...</header>
  <main>...</main>
  <footer>...</footer>

  <script src="js/app.js"></script> <!-- Importa o JavaScript -->
</body>
</html>
